services:
  db:
    image: postgres:16
    container_name: meetings-postgres
    environment:
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
      POSTGRES_DB: meetings
    ports:
      - "5432:5432"
    volumes:
      - meetings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings -d meetings"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetings-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://meetings:meetings@db:5432/meetings
      JWT_SECRET: ${JWT_SECRET:-meetings-course-jwt-secret-7f3a9c2e1b}
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./migrations:/app/migrations
      - ./seeders:/app/seeders
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: meetings-client
    ports:
      - "5173:5173"
    volumes:
      # Монтируются только исходники для hot-reload (Vite HMR).
      # node_modules берётся из образа.
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      - ./client/.env:/app/.env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  meetings_pgdata:
