services:
  db:
    image: postgres:16
    container_name: meetings-postgres
    environment:
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
      POSTGRES_DB: meetings
    ports:
      - "5433:5432"
    volumes:
      - meetings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings -d meetings"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetings-api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://meetings:meetings@db:5432/meetings
    volumes:
      - ./src:/app/src
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meetings_pgdata:
