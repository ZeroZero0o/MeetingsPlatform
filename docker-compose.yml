services:
  db:
    image: postgres:16
    container_name: meetings-postgres
    environment:
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
      POSTGRES_DB: meetings
    ports:
      - "5433:5432"
    volumes:
      - meetings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings -d meetings"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  meetings_pgdata:
