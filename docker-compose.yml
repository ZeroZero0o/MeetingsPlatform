services:
  mongo:
    image: mongo:7
    container_name: meetings-mongo
    ports:
      - "27017:27017"
    volumes:
      - meetings_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetings-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/meetings
      JWT_SECRET: ${JWT_SECRET:-meetings-course-jwt-secret-7f3a9c2e1b}
    volumes:
      # Исходники монтируются для hot-reload (nodemon).
      # node_modules берётся из образа.
      - ./src:/app/src
      - ./models:/app/models
      - ./seed.js:/app/seed.js
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: meetings-client
    ports:
      - "5173:5173"
    volumes:
      # Монтируются только исходники для hot-reload (Vite HMR).
      # node_modules берётся из образа.
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      - ./client/.env:/app/.env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  meetings_mongodata:
